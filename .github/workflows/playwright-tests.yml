name: Playwright API Automation Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
#  schedule:
#    # Run regression & security suites nightly at 00:00 UTC
#    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      test_tag:
        description: 'Test tag to execute (@smoke, @sanity, @regression, @security, @integration, @e2e)'
        required: true
        default: '@smoke'

jobs:
  smoke-tests:
    name: Smoke Test Matrix (Fast Feedback)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Execute Smoke Tests
        run: npx playwright test --grep @smoke
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-report
          path: playwright-report/
          retention-days: 7

  nightly-regression:
    name: Nightly Full Regression, Security & Integration Suite
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Execute Nightly Suite (@regression, @security, @integration)
        run: npx playwright test --grep "@regression|@security|@integration"
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-test-report
          path: playwright-report/
          retention-days: 30

  manual-dispatch:
    name: Tag-Targeted Dispatch Execution
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Execute Selected Tag
        run: npx playwright test --grep "${{ github.event.inputs.test_tag }}"
      - name: Upload HTML Test Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dispatch-test-report
          path: playwright-report/
          retention-days: 14

  openapi-drift-check:
    name: OpenAPI Spec Drift Detection Job
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Check Contract Drift
        run: npx tsc --noEmit
